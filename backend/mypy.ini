# mypy config for the FastAPI backend (run from backend/: `mypy .`).
[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True

[mypy-joblib.*,sklearn.*,transformers.*,torch.*,datasets.*,pandas.*]
ignore_missing_imports = True

# Modules added with full type hints are checked strictly.
[mypy-ml.roberta_client,ml.circuit_breaker,ml.model_router,ml.evaluation,services.intent_decision,schemas.prediction]
disallow_untyped_defs = True
disallow_incomplete_defs = True
